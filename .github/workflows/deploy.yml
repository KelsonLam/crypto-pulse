name: Deploy to GitHub Pages

# Build the site and publish it to GitHub Pages on every push to main.
# You can also run it by hand from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant the permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time, without cancelling one in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
